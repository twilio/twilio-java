name: CI
on:
  push:
    branches: ["supplychain-*"]
  pull_request:
    branches: ["supplychain-*"]

jobs:
  build:
    name: Build
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || 'ubuntu-x64' }}
    environment: test_docker
    permissions:
      id-token: write
      contents: read
    timeout-minutes: 20
    steps:
      - name: Checkout twilio-java
        uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # v3

      - name: Set up Java
        uses: actions/setup-java@17f84c3641ba7b8f6deff6309fc4c864478f5d62 # v3
        with:
          distribution: "temurin"
          java-version: "11"
          cache: "maven"

      - name: Print Maven settings.xml (before OIDC)
        run: |
          if [ -f ~/.m2/settings.xml ]; then
            sed -E 's/.*(password|token).*/SOMETHING SECRET/I' ~/.m2/settings.xml
          else
            echo "~/.m2/settings.xml does not exist"
          fi

      - name: Artifactory OIDC
        if: ${{ !github.event.pull_request.head.repo.fork }}
        uses: twilio/sdk-actions/artifactory-oidc@97794ed86013544c414c75b816ae0cc032af1e13 # oidc_support_setupjava
        with:
          ecosystem: "maven"

      - name: Print Maven settings.xml (after OIDC)
        run: |
          if [ -f ~/.m2/settings.xml ]; then
            sed -E 's/.*(password|token).*/SOMETHING SECRET/I' ~/.m2/settings.xml
          else
            echo "~/.m2/settings.xml does not exist"
          fi

      - run: mvn install -DskipTests=true -Dgpg.skip -Dmaven.javadoc.skip=true -B -V
